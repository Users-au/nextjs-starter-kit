name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_URL: https://app.users.test
      NEXTAUTH_SECRET: ci-only-nonsecret-fixture-with-more-than-32-characters
      USERSAU_HOST: https://identity.users.test
      NEXT_PUBLIC_USERSAU_HOST: https://identity.users.test
      USERSAU_CLIENT_ID: ci-client
      USERSAU_CLIENT_SECRET: ci-only-nonsecret-client-fixture
      USERSAU_ACCESS_MODE: allowlist
      USERSAU_ALLOWED_USER_IDS: "42"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run build
      - run: npm run test:integration
